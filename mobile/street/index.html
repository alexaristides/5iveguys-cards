<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>5IVE STREET</title>
<style>
  :root {
    --purple: #a855f7;
    --purple-deep: #7e22ce;
    --gold: #fbbf24;
    --ink: #0a0a0a;
    --text: #ffffff;
    --text2: #d4d4d8;
    --display: "AvenirNextCondensed-HeavyItalic", "Avenir Next Condensed", "Arial Narrow", "Arial Black", sans-serif;
    --sl: max(16px, env(safe-area-inset-left));
    --sr: max(16px, env(safe-area-inset-right));
    --sb: max(10px, env(safe-area-inset-bottom));
  }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0614; color: var(--text); font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; touch-action: none; overscroll-behavior: none; }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .layer { position: fixed; inset: 0; pointer-events: none; }
  .layer > * { pointer-events: auto; }
  .hidden { display: none !important; }
  .display { font-family: var(--display); font-weight: 800; font-style: italic; letter-spacing: 0.02em; text-transform: uppercase; }

  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .btn { font-family: var(--display); font-weight: 800; font-style: italic; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 12px 26px; border-radius: 12px; background: var(--purple-deep); color: #fff; font-size: 20px;
    box-shadow: 0 4px 0 #4c1488, 0 10px 24px rgba(126, 34, 206, 0.45); transform: skewX(-8deg); }
  .btn:active { transform: skewX(-8deg) translateY(3px); box-shadow: 0 1px 0 #4c1488; }
  .btn.ghost { background: rgba(255,255,255,0.1); box-shadow: none; }
  .btn:disabled { opacity: 0.4; }

  /* ── Team select ─────────────────────────────────────────────── */
  #select .title { position: absolute; top: max(10px, env(safe-area-inset-top)); left: var(--sl); right: var(--sr); display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
  #select .logo { font-size: 30px; line-height: 1; text-shadow: 0 2px 0 var(--purple-deep), 0 0 18px rgba(168,85,247,0.6); }
  #select .logo small { display: block; font-size: 13px; color: var(--text2); letter-spacing: 0.12em; text-shadow: none; margin-top: 2px; }
  #select .hint { font-size: 13px; color: var(--text2); text-align: right; }
  #select .exit { pointer-events: auto; }
  #select .tags { position: absolute; inset: 0; pointer-events: none; }
  .tag { position: absolute; transform: translate(-50%, 0); text-align: center; width: 104px; pointer-events: none; }
  .tag .nm { font-size: 17px; line-height: 1; text-shadow: 0 2px 6px rgba(0,0,0,0.7); }
  .tag .ovr { display: inline-block; font-size: 12px; padding: 2px 6px; border-radius: 6px; background: rgba(0,0,0,0.6); margin-top: 3px; }
  .tag .side { display: inline-block; font-size: 11px; padding: 2px 6px; border-radius: 6px; margin-top: 3px; margin-left: 3px; }
  .tag.home .side { background: var(--purple-deep); }
  .tag.away .side { background: #1c1917; color: var(--gold); border: 1px solid #a16207; }
  .tag .best { font: 600 10px -apple-system, Helvetica, Arial, sans-serif; color: var(--text2); margin-top: 4px; text-shadow: 0 1px 3px #000; }
  .tag .best b { color: #fff; }
  #select .bar { position: absolute; left: var(--sl); right: var(--sr); bottom: var(--sb); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .seg { display: flex; background: rgba(0,0,0,0.5); border-radius: 10px; padding: 3px; }
  .seg button { padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--text2); }
  .seg button.on { background: rgba(255,255,255,0.16); color: #fff; }

  /* ── Match HUD ───────────────────────────────────────────────── */
  #hud .score { position: absolute; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; align-items: stretch; pointer-events: none;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5)); }
  #hud .team { display: flex; align-items: center; gap: 8px; padding: 5px 12px; font-size: 18px; transform: skewX(-10deg); }
  #hud .team.home { background: linear-gradient(90deg, #6b21a8, #a326d6); border-radius: 8px 0 0 8px; }
  #hud .team.away { background: linear-gradient(90deg, #1c1917, #292524); color: var(--gold); border-radius: 0 8px 8px 0; }
  #hud .goals { font-size: 24px; min-width: 22px; text-align: center; }
  #hud .clock { background: #fff; color: #111; font-size: 18px; padding: 5px 10px; display: flex; align-items: center; transform: skewX(-10deg); font-variant-numeric: tabular-nums; }
  #hud .clock.gg { background: var(--gold); }
  #hud .meters { position: absolute; top: calc(max(8px, env(safe-area-inset-top)) + 40px); left: 50%; transform: translateX(-50%); display: flex; gap: 70px; pointer-events: none; }
  .meter { width: 92px; height: 7px; background: rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden; transform: skewX(-12deg); }
  .meter i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #c084fc, #f0abfc); transition: width 0.25s; }
  .meter.away i { background: linear-gradient(90deg, #f59e0b, #fde68a); }
  .meter.full i { animation: pulse 0.5s infinite alternate; }
  @keyframes pulse { from { filter: brightness(1); } to { filter: brightness(1.7); } }
  #hud .pause { position: absolute; top: max(8px, env(safe-area-inset-top)); left: var(--sl); width: 40px; height: 40px; border-radius: 12px; background: rgba(0,0,0,0.45); font-size: 16px; font-weight: 900; }
  #hud .onball { position: absolute; left: var(--sl); bottom: calc(var(--sb) + 2px); font-size: 16px; padding: 3px 10px; border-radius: 6px; background: rgba(0,0,0,0.45); pointer-events: none; transform: skewX(-10deg); }
  #hud .tip { position: absolute; left: 50%; top: calc(max(8px, env(safe-area-inset-top)) + 58px); transform: translateX(-50%); max-width: min(560px, 80vw); text-align: center;
    font-size: 13px; line-height: 1.35; padding: 7px 12px; border-radius: 10px; background: rgba(0,0,0,0.6); color: var(--text2); pointer-events: none; transition: opacity .5s; }
  #hud .tip b { color: #fff; }
  #hud .tip.out { opacity: 0; }
  #hud .me { position: absolute; left: 0; top: 0; font-size: 12px; padding: 1px 6px; border-radius: 5px; background: rgba(126,34,206,0.85); pointer-events: none; white-space: nowrap; }
  #hud .onball.home { border-left: 4px solid var(--purple); }
  #hud .onball.away { border-left: 4px solid var(--gold); }

  .pop { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); pointer-events: none; text-align: center; white-space: nowrap; }
  .pop .big { font-size: 64px; line-height: 0.9; color: #fff; text-shadow: 0 4px 0 var(--purple-deep), 0 0 30px rgba(168,85,247,0.8); }
  .pop .big.gold { text-shadow: 0 4px 0 #92400e, 0 0 30px rgba(251,191,36,0.8); color: #fde68a; }
  .pop .small { font-size: 20px; color: var(--text2); margin-top: 4px; }
  .pop.anim { animation: popin 1.6s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes popin {
    0% { transform: translate(-50%, -50%) scale(0.3) skewX(-10deg); opacity: 0; }
    15% { transform: translate(-50%, -50%) scale(1.08) skewX(-10deg); opacity: 1; }
    25% { transform: translate(-50%, -50%) scale(1) skewX(-10deg); }
    80% { opacity: 1; }
    100% { transform: translate(-50%, -60%) scale(1) skewX(-10deg); opacity: 0; }
  }
  .style { position: absolute; left: 50%; top: 20%; transform: translateX(-50%); pointer-events: none; font-size: 26px; white-space: nowrap; }
  .style.anim { animation: rise 1.2s ease-out forwards; }
  .style.home { color: #e9d5ff; text-shadow: 0 2px 0 var(--purple-deep); }
  .style.away { color: #fde68a; text-shadow: 0 2px 0 #92400e; }
  @keyframes rise { 0% { opacity: 0; transform: translate(-50%, 10px) scale(0.8) skewX(-10deg); } 20% { opacity: 1; transform: translate(-50%, 0) scale(1.05) skewX(-10deg); } 100% { opacity: 0; transform: translate(-50%, -26px) scale(1) skewX(-10deg); } }

  /* Controls */
  #stickzone { position: absolute; left: 0; top: 60px; bottom: 0; width: 50%; }
  .stick { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.06); pointer-events: none; }
  .stick i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255,255,255,0.35); box-shadow: 0 0 0 2px rgba(255,255,255,0.4); }
  .stick.idle { opacity: 0.45; }
  #buttons { position: absolute; right: var(--sr); bottom: var(--sb); width: 220px; height: 190px; pointer-events: none; }
  .pad { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; pointer-events: auto; color: #fff;
    font-family: var(--display); font-weight: 800; font-style: italic; text-transform: uppercase; letter-spacing: 0.03em; touch-action: none;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.28), rgba(255,255,255,0.08)); border: 2px solid rgba(255,255,255,0.35); box-shadow: 0 4px 14px rgba(0,0,0,0.35); }
  .pad.down { transform: scale(0.92); background: rgba(255,255,255,0.35); }
  .pad .ring { position: absolute; inset: -6px; border-radius: 50%; pointer-events: none; }
  #b-shoot { width: 96px; height: 96px; right: 0; bottom: 6px; font-size: 18px; background: radial-gradient(circle at 35% 30%, #c084fc, #7e22ce); border-color: #e9d5ff; }
  #b-pass { width: 70px; height: 70px; right: 112px; bottom: 0; font-size: 15px; }
  #b-skill { width: 70px; height: 70px; right: 72px; bottom: 112px; font-size: 15px; }
  #buttons.def #b-shoot { background: radial-gradient(circle at 35% 30%, #fb7185, #be123c); border-color: #fecdd3; }
  #buttons.def #b-skill { opacity: 0.35; }

  /* Overlays */
  .sheet { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(5,3,10,0.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .panel { min-width: 300px; max-width: 520px; padding: 18px 22px; border-radius: 18px; background: rgba(20,14,30,0.92); border: 1px solid rgba(168,85,247,0.35); text-align: center; }
  .panel h2 { margin: 0 0 6px; font-size: 34px; }
  .panel .row { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .final { display: flex; align-items: center; justify-content: center; gap: 18px; font-size: 54px; margin: 4px 0; }
  .final .h { color: #e9d5ff; } .final .a { color: var(--gold); }
  .scorers { display: flex; gap: 24px; justify-content: center; font-size: 13px; color: var(--text2); min-height: 18px; }
  .scorers div { text-align: left; } .scorers div:last-child { text-align: right; }
  .motm { margin-top: 8px; font-size: 14px; color: var(--text2); }
  .motm b { color: #fff; }
  .count { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: 80px; pointer-events: none; text-shadow: 0 4px 0 var(--purple-deep); }
  .loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 28px; background: #0b0614; z-index: 10; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="loading display" id="loading">5IVE STREET</div>
<!--GAME-->
</body>
</html>
