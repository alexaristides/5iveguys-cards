<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>5IVE STREET</title>
<meta name="description" content="3v3 street football in 3D with the 5ive Guys squad. Free to play — best on a phone held sideways." />
<meta property="og:title" content="5IVE STREET — 3v3 street football" />
<meta property="og:description" content="3v3 street football in 3D with the 5ive Guys squad. Free to play." />
<meta name="theme-color" content="#0b0614" />
<!-- Added to a phone's Home Screen, it opens full screen like an app. -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="5IVE STREET" />
<link rel="manifest" href="/street/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/street/icon.png" />
<style>
  :root {
    --purple: #a855f7;
    --purple-deep: #7e22ce;
    --gold: #fbbf24;
    --ink: #0a0a0a;
    --text: #ffffff;
    --text2: #d4d4d8;
    --display: "AvenirNextCondensed-HeavyItalic", "Avenir Next Condensed", "Arial Narrow", "Arial Black", sans-serif;
    --sl: max(16px, env(safe-area-inset-left));
    --sr: max(16px, env(safe-area-inset-right));
    --sb: max(10px, env(safe-area-inset-bottom));
  }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0614; color: var(--text); font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; touch-action: none; overscroll-behavior: none; }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .layer { position: fixed; inset: 0; pointer-events: none; }
  .layer > * { pointer-events: auto; }
  .hidden { display: none !important; }
  .display { font-family: var(--display); font-weight: 800; font-style: italic; letter-spacing: 0.02em; text-transform: uppercase; }

  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .btn { font-family: var(--display); font-weight: 800; font-style: italic; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 12px 26px; border-radius: 12px; background: var(--purple-deep); color: #fff; font-size: 20px;
    box-shadow: 0 4px 0 #4c1488, 0 10px 24px rgba(126, 34, 206, 0.45); transform: skewX(-8deg); }
  .btn:active { transform: skewX(-8deg) translateY(3px); box-shadow: 0 1px 0 #4c1488; }
  .btn.ghost { background: rgba(255,255,255,0.1); box-shadow: none; }
  .btn:disabled { opacity: 0.4; }

  /* ── Team select ─────────────────────────────────────────────── */
  #select { pointer-events: auto; }
  #select .title { position: absolute; top: max(10px, env(safe-area-inset-top)); left: var(--sl); right: var(--sr); display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
  #select .logo { font-size: 30px; line-height: 1; text-shadow: 0 2px 0 var(--purple-deep), 0 0 18px rgba(168,85,247,0.6); }
  #select .logo small { display: block; font-size: 13px; color: var(--text2); letter-spacing: 0.12em; text-shadow: none; margin-top: 2px; }
  #select .hint { font-size: 13px; color: var(--text2); text-align: right; white-space: nowrap; }
  #select .exit, #select .sides { pointer-events: auto; }
  #select .sides button { min-width: 78px; font-family: var(--display); font-style: italic; font-weight: 800; letter-spacing: 0.04em; }
  #select .sides button.home.on { background: var(--purple-deep); }
  #select .sides button.away.on { background: #1c1917; color: var(--gold); box-shadow: inset 0 0 0 1px #a16207; }
  #select .arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 42px; height: 64px; border-radius: 12px; background: rgba(0,0,0,0.45); font-size: 34px; font-weight: 800; line-height: 1; }
  #select .arrow.prev { left: var(--sl); }
  #select .arrow.next { right: var(--sr); }
  #select .tags { position: absolute; inset: 0; pointer-events: none; }
  .tag { position: absolute; transform: translate(-50%, 0); text-align: center; width: 104px; pointer-events: none; }
  .tag .nm { font-size: 17px; line-height: 1; text-shadow: 0 2px 6px rgba(0,0,0,0.7); }
  .tag .ovr { display: inline-block; font-size: 12px; padding: 2px 6px; border-radius: 6px; background: rgba(0,0,0,0.6); margin-top: 3px; }
  .tag .side { display: inline-block; font-size: 11px; padding: 2px 6px; border-radius: 6px; margin-top: 3px; margin-left: 3px; }
  .tag.home .side { background: var(--purple-deep); }
  .tag.away .side { background: #1c1917; color: var(--gold); border: 1px solid #a16207; }
  .tag.bench { opacity: 0.6; }
  .tag.bench .side { display: none; }
  .tag .best { font: 600 10px -apple-system, Helvetica, Arial, sans-serif; color: var(--text2); margin-top: 4px; text-shadow: 0 1px 3px #000; }
  .tag .best b { color: #fff; }
  #select .bar { position: absolute; left: var(--sl); right: var(--sr); bottom: var(--sb); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .seg { display: flex; background: rgba(0,0,0,0.5); border-radius: 10px; padding: 3px; }
  .seg button { padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--text2); }
  .seg button.on { background: rgba(255,255,255,0.16); color: #fff; }

  /* ── Match HUD ───────────────────────────────────────────────── */
  #hud .score { position: absolute; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; align-items: stretch; pointer-events: none;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5)); }
  #hud .team { display: flex; align-items: center; gap: 8px; padding: 5px 12px; font-size: 18px; transform: skewX(-10deg); }
  #hud .team.home { background: linear-gradient(90deg, #6b21a8, #a326d6); border-radius: 8px 0 0 8px; }
  #hud .team.away { background: linear-gradient(90deg, #1c1917, #292524); color: var(--gold); border-radius: 0 8px 8px 0; }
  #hud .goals { font-size: 24px; min-width: 22px; text-align: center; }
  #hud .clock { background: #fff; color: #111; font-size: 18px; padding: 5px 10px; display: flex; align-items: center; transform: skewX(-10deg); font-variant-numeric: tabular-nums; }
  #hud .clock.gg { background: var(--gold); }
  #hud .meters { position: absolute; top: calc(max(8px, env(safe-area-inset-top)) + 40px); left: 50%; transform: translateX(-50%); display: flex; gap: 70px; pointer-events: none; }
  .meter { width: 92px; height: 7px; background: rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden; transform: skewX(-12deg); }
  .meter i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #c084fc, #f0abfc); transition: width 0.25s; }
  .meter.away i { background: linear-gradient(90deg, #f59e0b, #fde68a); }
  .meter.full i { animation: pulse 0.5s infinite alternate; }
  @keyframes pulse { from { filter: brightness(1); } to { filter: brightness(1.7); } }
  #hud .pause { position: absolute; top: max(8px, env(safe-area-inset-top)); left: var(--sl); width: 40px; height: 40px; border-radius: 12px; background: rgba(0,0,0,0.45); font-size: 16px; font-weight: 900; }
  #hud .onball { position: absolute; left: var(--sl); bottom: calc(var(--sb) + 2px); font-size: 16px; padding: 3px 10px; border-radius: 6px; background: rgba(0,0,0,0.45); pointer-events: none; transform: skewX(-10deg); }
  #hud .tip { position: absolute; left: 50%; top: calc(max(8px, env(safe-area-inset-top)) + 58px); transform: translateX(-50%); max-width: min(560px, 80vw); text-align: center;
    font-size: 13px; line-height: 1.35; padding: 7px 12px; border-radius: 10px; background: rgba(0,0,0,0.6); color: var(--text2); pointer-events: none; transition: opacity .5s; }
  #hud .tip b { color: #fff; }
  #hud .tip.out { opacity: 0; }
  #hud .me { position: absolute; left: 0; top: 0; font-size: 12px; padding: 1px 6px; border-radius: 5px; background: rgba(126,34,206,0.85); pointer-events: none; white-space: nowrap; }
  #hud .me .tank { display: block; height: 3px; margin: 1px 0 2px; border-radius: 2px; background: rgba(0,0,0,0.45); overflow: hidden; }
  #hud .me .tank b { display: block; height: 100%; background: #4ade80; }
  #hud .me .tank.winded b { background: #f59e0b; }
  #hud .onball.home { border-left: 4px solid var(--purple); }
  #hud .onball.away { border-left: 4px solid var(--gold); }
  /* Online away player: they watch from the other touchline, so their side of the scoreboard is on the left. */
  #hud.away .score, #hud.away .team, #hud.away .meters { flex-direction: row-reverse; }
  #hud.away .team.home { background: linear-gradient(-90deg, #6b21a8, #a326d6); border-radius: 0 8px 8px 0; }
  #hud.away .team.away { background: linear-gradient(-90deg, #1c1917, #292524); border-radius: 8px 0 0 8px; }
  #hud.away .me { background: rgba(28,25,23,0.88); color: var(--gold); }

  .pop { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); pointer-events: none; text-align: center; white-space: nowrap; }
  .pop .big { font-size: 64px; line-height: 0.9; color: #fff; text-shadow: 0 4px 0 var(--purple-deep), 0 0 30px rgba(168,85,247,0.8); }
  .pop .big.gold { text-shadow: 0 4px 0 #92400e, 0 0 30px rgba(251,191,36,0.8); color: #fde68a; }
  .pop .small { font-size: 20px; color: var(--text2); margin-top: 4px; }
  .pop.anim { animation: popin 1.6s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes popin {
    0% { transform: translate(-50%, -50%) scale(0.3) skewX(-10deg); opacity: 0; }
    15% { transform: translate(-50%, -50%) scale(1.08) skewX(-10deg); opacity: 1; }
    25% { transform: translate(-50%, -50%) scale(1) skewX(-10deg); }
    80% { opacity: 1; }
    100% { transform: translate(-50%, -60%) scale(1) skewX(-10deg); opacity: 0; }
  }
  .style { position: absolute; left: 50%; top: 20%; transform: translateX(-50%); pointer-events: none; font-size: 26px; white-space: nowrap; }
  .style.anim { animation: rise 1.2s ease-out forwards; }
  .style.home { color: #e9d5ff; text-shadow: 0 2px 0 var(--purple-deep); }
  .style.away { color: #fde68a; text-shadow: 0 2px 0 #92400e; }
  @keyframes rise { 0% { opacity: 0; transform: translate(-50%, 10px) scale(0.8) skewX(-10deg); } 20% { opacity: 1; transform: translate(-50%, 0) scale(1.05) skewX(-10deg); } 100% { opacity: 0; transform: translate(-50%, -26px) scale(1) skewX(-10deg); } }

  /* Controls */
  #stickzone { position: absolute; left: 0; top: 60px; bottom: 0; width: 50%; }
  .stick { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.06); pointer-events: none; }
  .stick i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255,255,255,0.35); box-shadow: 0 0 0 2px rgba(255,255,255,0.4); }
  .stick.idle { opacity: 0.45; }
  /* Stamina ring round the stick (once it isn't full); the stick glows while sprinting. */
  .stick .ring { position: absolute; left: -10px; top: -10px; width: calc(100% + 20px); height: calc(100% + 20px); opacity: 0; transition: opacity 0.3s; }
  .stick.tired .ring { opacity: 1; }
  .stick.sprint { border-color: rgba(74,222,128,0.9); box-shadow: 0 0 18px rgba(74,222,128,0.45); }
  .stick.sprint i { background: rgba(74,222,128,0.55); }
  #buttons { position: absolute; right: var(--sr); bottom: var(--sb); width: 220px; height: 190px; pointer-events: none; }
  .pad { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; pointer-events: auto; color: #fff;
    font-family: var(--display); font-weight: 800; font-style: italic; text-transform: uppercase; letter-spacing: 0.03em; touch-action: none;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.28), rgba(255,255,255,0.08)); border: 2px solid rgba(255,255,255,0.35); box-shadow: 0 4px 14px rgba(0,0,0,0.35); }
  .pad.down { transform: scale(0.92); background: rgba(255,255,255,0.35); }
  .pad .ring { position: absolute; inset: -6px; border-radius: 50%; pointer-events: none; }
  #b-shoot { width: 96px; height: 96px; right: 0; bottom: 6px; font-size: 18px; background: radial-gradient(circle at 35% 30%, #c084fc, #7e22ce); border-color: #e9d5ff; }
  #b-pass { width: 70px; height: 70px; right: 112px; bottom: 0; font-size: 15px; }
  #b-skill { width: 70px; height: 70px; right: 72px; bottom: 112px; font-size: 15px; }
  #buttons.def #b-shoot { background: radial-gradient(circle at 35% 30%, #fb7185, #be123c); border-color: #fecdd3; }
  #buttons.def #b-skill { opacity: 0.35; }

  /* Overlays */
  .sheet { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(5,3,10,0.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .panel { min-width: 300px; max-width: 520px; padding: 18px 22px; border-radius: 18px; background: rgba(20,14,30,0.92); border: 1px solid rgba(168,85,247,0.35); text-align: center; }
  .panel h2 { margin: 0 0 6px; font-size: 34px; }
  .panel .row { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .final { display: flex; align-items: center; justify-content: center; gap: 18px; font-size: 54px; margin: 4px 0; }
  .final .h { color: #e9d5ff; } .final .a { color: var(--gold); }
  .scorers { display: flex; gap: 24px; justify-content: center; font-size: 13px; color: var(--text2); min-height: 18px; }
  .scorers div { text-align: left; } .scorers div:last-child { text-align: right; }
  .motm { margin-top: 8px; font-size: 14px; color: var(--text2); }
  .motm b { color: #fff; }
  .count { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: 80px; pointer-events: none; text-shadow: 0 4px 0 var(--purple-deep); }
  /* Phones held upright on the website: ask for landscape (the app locks it). */
  #rotate { display: none; position: fixed; inset: 0; z-index: 20; background: #0b0614; color: #fff; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
  #rotate .phone { width: 44px; height: 76px; border: 3px solid #c084fc; border-radius: 10px; animation: turn 1.6s ease-in-out infinite; }
  @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  /* iPhone Safari on the website: swipe up to tuck the browser's bars away (ui/fullscreen.ts). */
  html.ios-bars, html.ios-bars body { height: auto; min-height: 100%; overflow: visible; }
  #swipe-room { height: 300vh; }
  #swipe { display: none; position: fixed; inset: 0; z-index: 30; background: rgba(11,6,20,0.82); color: #fff; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; }
  #swipe .display { font-size: 30px; }
  #swipe .sub { color: #a1a1aa; font-size: 15px; }
  #swipe .tip { margin-top: 14px; padding: 6px 12px; border-radius: 10px; background: rgba(255,255,255,0.08); color: #d4d4d8; font-size: 13px; }
  #swipe .hand { font-size: 40px; font-weight: 900; color: #c084fc; animation: swipe 1.2s ease-in-out infinite; }
  @keyframes swipe { 0% { transform: translateY(14px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-14px); opacity: 0; } }
  html.swipe #swipe { display: flex; }
  html.swipe, html.swipe body, html.swipe #swipe { touch-action: pan-y; }
  .loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 28px; background: #0b0614; z-index: 10; }

  /* ── Story mode ──────────────────────────────────────────────── */
  #story, #story .st-screen, #story .st-tags { pointer-events: none; }
  #story .st-screen, #story .st-tags { position: absolute; inset: 0; }
  #story .st-screen > *, #story .st-talk { pointer-events: auto; }
  .btn.sm { padding: 8px 14px; font-size: 15px; }
  #select .go-story { background: rgba(251,191,36,0.22); color: #fde68a; box-shadow: inset 0 0 0 1px rgba(251,191,36,0.55); }
  .btn.danger { background: rgba(225,29,72,0.25); color: #fecdd3; }
  .av { display: inline-block; flex: none; border-radius: 50%; background-color: #3f3f46; background-repeat: no-repeat; box-shadow: 0 0 0 2px rgba(255,255,255,0.25); }
  .av.badge { display: inline-flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 800; font-style: italic; letter-spacing: 0.02em; }
  .dim { color: #52525b; }
  .nem { color: #f43f5e; font-style: normal; }

  .st-talk { position: absolute; inset: 0; background: linear-gradient(rgba(5,3,10,0) 35%, rgba(5,3,10,0.88)); cursor: pointer; }
  .st-talk .skip { position: absolute; top: max(10px, env(safe-area-inset-top)); right: var(--sr); padding: 8px 14px; border-radius: 10px; background: rgba(0,0,0,0.5); color: var(--text2); font-size: 14px; font-weight: 700; }
  .st-talk .box { position: absolute; left: max(var(--sl), calc(50% - 360px)); right: max(var(--sr), calc(50% - 360px)); bottom: calc(var(--sb) + 8px); display: flex; gap: 14px; align-items: center;
    padding: 14px 18px; border-radius: 18px; background: rgba(20,14,30,0.94); border: 1px solid rgba(168,85,247,0.4); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .st-talk .box.in { animation: talkin 0.25s ease-out; }
  @keyframes talkin { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .st-talk .who:empty { display: none; }
  .st-talk .body { flex: 1; min-width: 0; }
  .st-talk .name { font-size: 14px; color: #d8b4fe; letter-spacing: 0.06em; margin-bottom: 3px; }
  .st-talk .name:empty { display: none; }
  .st-talk .text { font-size: 17px; line-height: 1.35; }
  .st-talk .more { color: #c084fc; font-style: normal; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  .st-talk.narrator .text { font-style: italic; color: #e4e4e7; text-align: center; }
  .st-talk.news .box { background: #f5f5f4; color: #111; border-color: #111; }
  .st-talk.news .name { color: #57534e; }
  .st-talk.news .text { font-family: var(--display); font-weight: 800; font-style: italic; text-transform: uppercase; font-size: 22px; line-height: 1.1; }

  .st-hub .st-head { position: absolute; top: max(10px, env(safe-area-inset-top)); left: var(--sl); right: var(--sr); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .st-hub .logo { font-size: 28px; line-height: 1; text-shadow: 0 2px 0 var(--purple-deep), 0 0 18px rgba(168,85,247,0.6); }
  .st-hub .logo small { display: block; font-size: 12px; color: var(--text2); letter-spacing: 0.1em; text-shadow: none; margin-top: 3px; }
  .st-hub .logo { min-width: 0; }
  .st-hub .logo small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st-btns { display: flex; gap: 8px; flex: none; }
  .st-side { position: absolute; right: var(--sr); top: calc(max(10px, env(safe-area-inset-top)) + 52px); bottom: var(--sb); width: min(440px, 54vw); display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
  .st-table { width: 100%; border-collapse: collapse; font-size: 12px; background: rgba(10,6,18,0.78); border-radius: 12px; overflow: hidden; }
  .st-table th { font-size: 10px; letter-spacing: 0.08em; color: #a1a1aa; font-weight: 700; padding: 5px 4px; text-align: center; }
  .st-table td { padding: 4px; text-align: center; border-top: 1px solid rgba(255,255,255,0.06); white-space: nowrap; }
  .st-table .l { text-align: left; max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
  .st-table td:first-child { width: 18px; color: #a1a1aa; border-left: 3px solid transparent; }
  .st-table tr.up td:first-child { border-left-color: #22c55e; }
  .st-table tr.gold td:first-child { border-left-color: var(--gold); }
  .st-table tr.down td:first-child { border-left-color: #e11d48; }
  .st-table tr.you td { background: rgba(126,34,206,0.45); }
  .st-next { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(10,6,18,0.85); border: 1px solid rgba(168,85,247,0.35); }
  .st-next .lbl { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: #a1a1aa; }
  .st-next .club { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 800; margin: 3px 0; }
  .st-next .meta { font-size: 12px; color: var(--gold); }
  .st-next .meta .dim { color: #52525b; }

  .st-pick { position: absolute; inset: 0; background: rgba(5,3,10,0.72); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: flex; flex-direction: column; padding: max(10px, env(safe-area-inset-top)) 0 var(--sb); }
  .st-pick-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 var(--sr) 8px var(--sl); }
  .st-pick .ttl { font-size: 26px; line-height: 1; }
  .st-pick .ttl small { display: block; font: 600 12px -apple-system, Helvetica, Arial, sans-serif; color: var(--text2); text-transform: none; letter-spacing: 0; margin-top: 4px; }
  .st-pick .cards { flex: 1; display: flex; gap: 10px; align-items: center; overflow-x: auto; overflow-y: hidden; padding: 4px var(--sr) 4px var(--sl); touch-action: pan-x; -webkit-overflow-scrolling: touch; }
  .pcard { position: relative; flex: none; width: 138px; border-radius: 14px; overflow: hidden; background: rgba(24,18,36,0.95); border: 2px solid rgba(255,255,255,0.1); text-align: left; padding: 0; transition: transform 0.15s; }
  .pcard.on { border-color: #c084fc; box-shadow: 0 0 18px rgba(168,85,247,0.6); transform: translateY(-4px); }
  .pcard .art { height: min(118px, 30vh); background-size: cover; background-position: center 20%; }
  .pcard .top { position: absolute; top: 6px; left: 6px; display: flex; gap: 4px; align-items: center; }
  .pcard .ovr { font-size: 20px; padding: 1px 7px; border-radius: 8px; background: rgba(0,0,0,0.7); }
  .pcard .lv { font-size: 10px; font-weight: 800; padding: 2px 5px; border-radius: 6px; background: rgba(126,34,206,0.85); }
  .pcard .tagline { position: absolute; top: 8px; right: 6px; font-size: 12px; padding: 2px 7px; border-radius: 6px; background: var(--purple-deep); }
  .pcard .tagline:empty { display: none; }
  .pcard:not(.on) .tagline { background: rgba(0,0,0,0.65); color: #a1a1aa; }
  .pcard .info { padding: 6px 8px 8px; }
  .pcard .nm { font-size: 16px; line-height: 1.05; }
  .pcard .nm small { font-size: 10px; color: var(--gold); }
  .pcard .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px 4px; margin-top: 5px; font-size: 10px; color: #a1a1aa; }
  .pcard .stats b { color: #fff; }
  .pcard .stats .hi b { color: #86efac; }
  .pcard .tally { font-size: 10px; color: #a1a1aa; margin-top: 4px; }
  .xp { height: 4px; border-radius: 2px; background: rgba(255,255,255,0.12); overflow: hidden; margin-top: 4px; }
  .xp i { display: block; height: 100%; background: linear-gradient(90deg, #a855f7, #f0abfc); }

  .panel.st-result { width: min(780px, calc(100vw - 24px)); max-width: none; max-height: calc(100vh - 16px); overflow-y: auto; padding: 14px 18px; }
  .st-result .cols { display: grid; grid-template-columns: 1fr 1.15fr; gap: 16px; text-align: left; }
  .st-result .left { text-align: center; }
  .st-result .vs { font-size: 13px; color: var(--text2); margin-bottom: 4px; }
  .st-result .news { margin: 8px auto 0; max-width: 300px; padding: 6px 10px; background: #f5f5f4; color: #111; font: 800 italic 14px var(--display); text-transform: uppercase; line-height: 1.1; transform: rotate(-1deg); }
  .st-result .gains { display: flex; flex-direction: column; gap: 6px; max-height: min(300px, calc(100vh - 110px)); overflow-y: auto; touch-action: pan-y; }
  .gain { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 10px; background: rgba(255,255,255,0.05); }
  .gain.up { background: rgba(251,191,36,0.12); box-shadow: inset 0 0 0 1px rgba(251,191,36,0.5); }
  .g-main { flex: 1; min-width: 0; }
  .g-top { display: flex; justify-content: space-between; font-size: 13px; }
  .g-top .xpn { color: #d8b4fe; font-weight: 800; }
  .gain .why { font-size: 10px; color: #a1a1aa; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gain .lvup { font-size: 13px; color: var(--gold); text-align: center; line-height: 1; }
  .gain .lvup small { display: block; font-size: 15px; color: #fff; }
  .gain .ovrn { font-size: 18px; color: var(--text2); width: 34px; text-align: center; }
  .panel.st-final { width: min(520px, calc(100vw - 24px)); max-height: calc(100vh - 16px); overflow-y: auto; }
  .panel.st-final .st-table { font-size: 13px; }

  #hud .subs { position: absolute; top: max(8px, env(safe-area-inset-top)); left: calc(var(--sl) + 48px); height: 40px; padding: 0 12px; border-radius: 12px; background: rgba(0,0,0,0.45); font-size: 15px; }
  #hud .me.tired { background: rgba(190,18,60,0.9); }
  #hud .subs.warn { background: #b45309; animation: pulse 0.6s infinite alternate; }
  #hud .toast { bottom: calc(var(--sb) + 120px); z-index: 2; }
  .panel.st-subs { width: min(640px, calc(100vw - 24px)); max-width: none; max-height: calc(100vh - 16px); overflow-y: auto; text-align: left; }
  .panel.st-subs h2 { text-align: center; }
  .panel.st-subs > .sub { text-align: center; }
  .st-subs .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
  .st-subs .list { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .srow { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; background: rgba(255,255,255,0.06); text-align: left; border: 2px solid transparent; }
  .srow.sel { border-color: #f59e0b; background: rgba(245,158,11,0.15); }
  .srow.me .sn b::after { content: " ●"; color: #c084fc; font-size: 10px; }
  .st-subs.picking [data-bench] .srow { border-color: rgba(74,222,128,0.6); }
  .srow .sn { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 13px; }
  .srow .sn small { color: #a1a1aa; font-size: 10px; }
  .srow .en { width: 60px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.12); overflow: hidden; flex: none; }
  .srow .en i { display: block; height: 100%; background: #4ade80; }
  .srow .en.mid i { background: #facc15; }
  .srow .en.low i { background: #f43f5e; }
  .srow .pct { width: 34px; font-size: 11px; color: #a1a1aa; text-align: right; }
  .st-menu .panel { width: min(460px, calc(100vw - 24px)); }

  /* ── Online ──────────────────────────────────────────────────── */
  #select.online .diff, #select.online .random, #select.online .go-online, #select.online .go-story { display: none; }
  #select .btn.play.on { background: #15803d; box-shadow: 0 4px 0 #14532d, 0 10px 24px rgba(21,128,61,0.45); }
  #online .sheet { align-items: flex-start; padding-top: max(12px, env(safe-area-inset-top)); overflow-y: auto; }
  .panel.online { width: min(560px, calc(100vw - 32px)); text-align: left; }
  .panel.online .head { display: flex; align-items: center; justify-content: space-between; }
  .panel.online .head h2 { margin: 0; }
  .panel .x { width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,0.1); font-size: 16px; }
  .panel .sub { color: var(--text2); font-size: 13px; margin: 6px 0 0; line-height: 1.35; }
  .panel .row.tight { justify-content: flex-start; align-items: center; }
  .panel .err { color: #fda4af; font-size: 13px; min-height: 16px; margin: 8px 0 0; }
  .panel .label { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #a1a1aa; text-transform: uppercase; margin-top: 6px; }
  form.code { display: flex; gap: 8px; align-items: center; }
  form.code input { width: 112px; height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.4); color: #fff;
    font: 800 20px var(--display); letter-spacing: 0.14em; text-align: center; text-transform: uppercase; -webkit-user-select: text; user-select: text; }
  form.code input::placeholder { color: #71717a; }
  form.code .btn { padding: 10px 16px; font-size: 17px; }
  .rooms { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; max-height: 34vh; overflow-y: auto; }
  .room { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,0.07); text-align: left; }
  .room img, .room i { width: 32px; height: 32px; border-radius: 50%; background: #3f3f46; flex: none; object-fit: cover; }
  .room span { flex: 1; display: flex; flex-direction: column; }
  .room small { color: #a1a1aa; font-size: 12px; letter-spacing: 0.06em; }
  .room em { font-style: normal; font-weight: 800; color: #d8b4fe; }
  .bigcode { font-size: 64px; line-height: 1; letter-spacing: 0.12em; color: #fff; text-shadow: 0 4px 0 var(--purple-deep); margin: 4px 0; }
  .spin { width: 34px; height: 34px; margin: 14px auto 4px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.15); border-top-color: var(--purple); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; left: 50%; bottom: calc(var(--sb) + 70px); transform: translateX(-50%) skewX(-8deg); padding: 8px 16px; border-radius: 10px; background: rgba(0,0,0,0.75); font-size: 16px; pointer-events: none; z-index: 5; }
  #hud .banner { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%) skewX(-8deg); padding: 10px 18px; border-radius: 12px; background: rgba(0,0,0,0.65); font-size: 20px; pointer-events: none; white-space: nowrap; }
  #hud .link { position: absolute; top: max(12px, env(safe-area-inset-top)); right: var(--sr); font: 700 10px -apple-system, Helvetica, Arial, sans-serif; letter-spacing: 0.08em; padding: 3px 7px; border-radius: 6px; background: rgba(21,128,61,0.75); pointer-events: none; }
  #hud .link.slow { background: rgba(180,83,9,0.8); }
</style>
